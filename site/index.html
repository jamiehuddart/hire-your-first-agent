<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hire Your First Agent</title>
  <meta name="description" content="A retro arcade game about building AI agents, for the High Intent Labs cohort.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="crt">
    <header class="hud">
      <button class="hud-logo" data-act="title" aria-label="Back to title screen">HYFA</button>
      <div class="hud-stats">
        <span>SCORE <b id="hud-score">000000</b></span>
        <span>CARDS <b id="hud-cards">0/0</b></span>
      </div>
    </header>
    <main id="app" tabindex="-1" aria-live="polite"></main>
    <footer class="foot">Made for the High Intent Labs cohort. All companies and people in the game are fictional.</footer>
  </div>

  <script src="data/level-1.js"></script>
  <script src="data/level-2.js"></script>
  <script src="data/level-3.js"></script>
  <script src="data/level-4.js"></script>
  <script src="data/level-5.js"></script>
  <script src="data/level-6.js"></script>
  <script src="data/level-7.js"></script>
  <script src="data/cards.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
